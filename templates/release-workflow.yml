workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

.release-rules:
  rules:
    - if: $CI_COMMIT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"

.publish-rules:
  rules:
    - if: $CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+(-(alpha|beta|rc)(\.\d+)?)?$/ && $CI_COMMIT_REF_PROTECTED == "true"
